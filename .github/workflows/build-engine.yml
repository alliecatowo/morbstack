name: Build patched Docker Engine

# The normal app/guest-image lane is macos-26 because it validates the
# Virtualization.framework product. Moby's supported Buildx build is a Linux
# workload, though, and hosted macOS runners do not provide Docker. Keep that
# dependency in this dedicated Linux lane and publish only an explicitly
# versioned engine tag; ordinary source changes produce an attested Actions
# artifact for review, never an implicit release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'engine-moby-v*'
    paths:
      - 'guest/moby-patches/**'
      - 'scripts/build-morbstack-dockerd.sh'
      - 'scripts/fetch-moby-source.sh'
      - 'scripts/fetch-guest-assets.sh'
      - '.github/workflows/build-engine.yml'

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build and attest Linux/arm64 dockerd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest supplies Docker Engine and Buildx. The source build
      # script performs its own explicit `docker buildx version` preflight,
      # applies the pinned patch in a detached Moby worktree, and requests
      # `linux/arm64`; this workflow deliberately does not duplicate it.
      - name: Build pinned patched dockerd
        run: ./scripts/build-morbstack-dockerd.sh

      # Keep a mismatched candidate available for the migration's first
      # Linux-cross-build proof, but make the job fail after it is uploaded
      # and attested. That gives an operator the exact bytes to inspect while
      # still making it impossible for the publish job to release them.
      - name: Compare candidate with the release pin
        id: release_pin
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^MORBSTACK_DOCKERD_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' scripts/fetch-guest-assets.sh)"
          actual="$(sha256sum dist/guest-bin/morbstack-dockerd | awk '{print $1}')"
          [ -n "${expected}" ] || { echo "::error::could not read MORBSTACK_DOCKERD_SHA256" >&2; exit 1; }
          printf 'actual=%s\n' "${actual}" >> "${GITHUB_OUTPUT}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::patched dockerd digest ${actual} does not match pinned release digest ${expected}" >&2
            echo "::error::inspect the candidate artifact, then intentionally update the release tag and SHA pin together" >&2
            echo 'matches=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'matches=true' >> "${GITHUB_OUTPUT}"
          fi
          printf '%s  %s\n' "${actual}" "morbstack-dockerd" > dist/guest-bin/morbstack-dockerd.sha256

      - name: Upload engine candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: morbstack-dockerd-linux-arm64
          if-no-files-found: error
          path: |
            dist/guest-bin/morbstack-dockerd
            dist/guest-bin/morbstack-dockerd.sha256

      - name: Attest engine candidate artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/guest-bin/morbstack-dockerd

      - name: Fail if candidate does not match release pin
        if: steps.release_pin.outputs.matches != 'true'
        run: |
          echo "::error::candidate ${{ steps.release_pin.outputs.actual }} is available as an Actions artifact, but cannot be released until the tag and SHA pin are intentionally updated together." >&2
          exit 1

  publish:
    name: Publish explicit engine tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/engine-moby-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified engine artifact
        uses: actions/download-artifact@v4
        with:
          name: morbstack-dockerd-linux-arm64
          path: dist/guest-bin

      - name: Require the pinned release tag
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^MORBSTACK_DOCKERD_RELEASE_TAG="\([^"]*\)"$/\1/p' scripts/fetch-guest-assets.sh)"
          [ -n "${expected}" ] || { echo "::error::could not read MORBSTACK_DOCKERD_RELEASE_TAG" >&2; exit 1; }
          [ "${GITHUB_REF_NAME}" = "${expected}" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the pinned engine tag ${expected}" >&2
            exit 1
          }

      - name: Create or update engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              dist/guest-bin/morbstack-dockerd \
              dist/guest-bin/morbstack-dockerd.sha256 \
              --clobber
          else
            gh release create "${tag}" \
              dist/guest-bin/morbstack-dockerd \
              dist/guest-bin/morbstack-dockerd.sha256 \
              --title "Morbstack patched dockerd (${tag})" \
              --notes "Pinned Linux/arm64 Moby build. Verify the SHA-256 sidecar and GitHub build provenance attestation before use."
          fi
