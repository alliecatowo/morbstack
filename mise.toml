# mise configuration for Morbstack.
#
# This file is the single source of truth for build logic. Two toolchains
# live side by side: Swift (host daemon + CLI, under mac/) and Rust (guest
# PID 1, under guest/morbinit/). `mise install` pins the Rust compiler for
# every contributor and CI; Swift is not managed here — it comes from the
# Xcode toolchain (macOS 26.4 / Swift 6.3).
#
# The Makefile at the repo root is now a thin compatibility shim: every
# `make <target>` just runs `mise run <target>`. It exists only so callers
# that still type `make build` keep working; new callers (docs, CI, scripts)
# should use `mise run <task>` directly. See docs/build.md for the full task
# list.
#
# NOTE on first run: `mise run <anything>` requires this file to already be
# trusted, which is a chicken-and-egg problem for a task that tries to
# automate `mise trust` itself — mise refuses to even parse an untrusted
# config to find the task in the first place. So the very first command on a
# fresh clone must be literal `mise trust && mise install` (see README.md /
# CONTRIBUTING.md and the Makefile's `setup` shim), not `mise run setup`.
# The `setup` task below still exists for convenience on an already-trusted
# checkout (e.g. after pulling a mise.toml change that bumps the Rust pin).

[tools]
rust = "stable"

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Trust this config and install pinned toolchains (Rust; Swift comes from Xcode)"
run = """
mise trust
mise install
"""

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build everything: mac host binaries and the guest init binary"
depends = ["build-mac", "build-guest"]

[tasks.build-mac]
description = "Build morbstackd and morb (Swift), host arch"
run = "cd mac && swift build"

[tasks.build-guest]
description = "Build morbinit (Rust, guest PID 1), host arch"
run = "cd guest/morbinit && cargo build"

# Where the messense/homebrew-macos-cross-toolchains aarch64-unknown-linux-musl
# GCC cross toolchain lives (see dist/CROSS_COMPILE.md for the install
# recipe). Only used by cross-build-guest / guest-image, so a plain
# build-guest (host-arch dev loop) never needs it on PATH.
[tasks.cross-build-guest]
description = "Cross-compile morbinit for aarch64-unknown-linux-musl (the real guest target)"
run = """
CROSS_TOOLCHAIN_BIN=/opt/homebrew/opt/aarch64-unknown-linux-musl/bin
if [ ! -x "$CROSS_TOOLCHAIN_BIN/aarch64-unknown-linux-musl-gcc" ]; then
	echo "error: aarch64-unknown-linux-musl cross toolchain not found at $CROSS_TOOLCHAIN_BIN" >&2
	echo "       see dist/CROSS_COMPILE.md for the install recipe (brew tap" >&2
	echo "       messense/macos-cross-toolchains && brew install" >&2
	echo "       messense/macos-cross-toolchains/aarch64-unknown-linux-musl)" >&2
	exit 1
fi
cd guest/morbinit && \
	PATH="$CROSS_TOOLCHAIN_BIN:$PATH" \
	CC_aarch64_unknown_linux_musl="$CROSS_TOOLCHAIN_BIN/aarch64-unknown-linux-musl-gcc" \
	CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$CROSS_TOOLCHAIN_BIN/aarch64-unknown-linux-musl-gcc" \
	cargo build --release --target aarch64-unknown-linux-musl
"""

# Build the bootable initramfs: cross-compiled morbinit as /init, plus the
# Alpine minirootfs and the static Docker engine binaries from dist/. Writes
# $MORBSTACK_HOME/data/kernel/initrd.img (default ~/.morbstack, override via
# the MORBSTACK_HOME env var, honoured by scripts/mkinitramfs.sh itself).
[tasks.guest-image]
description = "Build the bootable guest initramfs (cross-compiled morbinit + Alpine rootfs + Docker engine)"
depends = ["cross-build-guest"]
run = "scripts/mkinitramfs.sh"

# ---------------------------------------------------------------------------
# Sign / run
# ---------------------------------------------------------------------------

# Ad-hoc codesign with the entitlements morbstackd needs to open a
# Virtualization.framework VM (com.apple.security.virtualization, etc.).
# Development-only: signs with the local machine identity ("-"), not a
# Developer ID. Depends on build-mac so this works on a fresh checkout
# instead of failing on a missing binary.
#
# The real binary lives at mac/.build/arm64-apple-macosx/debug/morbstackd;
# mac/.build/debug is a symlink to the per-arch build dir, so signing
# through it signs the same file `swift build` just produced. This must be
# the LAST step before starting the daemon: `swift build` strips
# com.apple.security.virtualization from morbstackd on every rebuild.
[tasks.sign]
description = "Ad-hoc codesign morbstackd with the virtualization entitlement (must run after any swift build, before starting the daemon)"
depends = ["build-mac"]
run = 'codesign --force --sign - --entitlements mac/Resources/morbstackd.entitlements mac/.build/debug/morbstackd'

[tasks.run-daemon]
description = "Build, sign, and run the daemon in the foreground for local development"
depends = ["sign"]
run = "exec mac/.build/debug/morbstackd --foreground"

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

# The Swift suite only exists once mac/Tests is populated, so guard on that
# to keep this green on a fresh checkout.
[tasks.test]
description = "Run the Swift and Rust test suites"
run = """
if [ -d mac/Tests ]; then (cd mac && swift test); fi
(cd guest/morbinit && cargo test)
"""

# ---------------------------------------------------------------------------
# Live-window probe
# ---------------------------------------------------------------------------

# Exercise real MorbstackApp routes against fixtures. This is deliberately **not** a
# screenshot task: it writes only a text route-probe record and never samples a view
# cache. See Sources/MorbstackAppCore/Shots/LiveCapture.swift. Use Computer Use or a
# future XCUITest host to review the actual titlebar, toolbar, sidebar, and Liquid Glass.
#
# `--tour-fixtures` serves the deterministic Docker world checked by `MorbShots`, so no
# morbstackd and no VM are needed — this never starts the engine. Only build-mac, not
# sign: nothing here touches the daemon, so morbstackd's virtualization entitlement is
# irrelevant to this target.
#
# Two full launches, not one: SwiftUI's `.preferredColorScheme` is applied
# when the window is created, so light and dark each need their own process.
# The app briefly takes focus and shows real windows on screen while each
# run probes — that is necessary to exercise real navigation in a genuine window.
[tasks.shots-live]
description = "Run non-visual fixture route probes in real light and dark app windows"
depends = ["build-mac"]
run = """
mkdir -p dist/fixture-route-probe
mac/.build/debug/MorbstackApp --tour-fixtures --tour-capture dist/fixture-route-probe \
	--window-size 1440x900 --appearance light
mac/.build/debug/MorbstackApp --tour-fixtures --tour-capture dist/fixture-route-probe \
	--window-size 1440x900 --appearance dark
"""

# ---------------------------------------------------------------------------
# The SwiftUI app bundle.
#
# SwiftPM builds executables, not `.app`s, so the bundle is assembled by hand
# here. That is a feature rather than a workaround: the layout is thirty
# lines of `cp` and `mkdir` that anyone can read, with no Xcode project to
# drift out of sync with Package.swift and nothing to regenerate on a fresh
# clone.
# ---------------------------------------------------------------------------

# Render the icon PNGs and pack them into an .icns.
#
# `iconutil` is part of the base system, so this needs nothing installed.
# The iconset directory is rebuilt from scratch each time the task actually
# runs: a stale PNG left over from an earlier design silently ends up in the
# icns, and the only symptom is a Dock icon that is wrong at exactly one
# size. sources/outputs are declared because the icon is generated
# procedurally (make-icon.swift draws every shape in code, no external image
# assets) — safe to skip when that one script hasn't changed.
[tasks.app-icon]
description = "Render AppIcon.icns from mac/AppResources/make-icon.swift"
sources = ["mac/AppResources/make-icon.swift"]
outputs = ["mac/.build/AppIcon.icns"]
run = """
rm -rf mac/.build/AppIcon.iconset
mkdir -p mac/.build/AppIcon.iconset
swift mac/AppResources/make-icon.swift mac/.build/AppIcon.iconset
iconutil --convert icns --output mac/.build/AppIcon.icns mac/.build/AppIcon.iconset
"""

# Build a launchable Morbstack.app in dist/.
#
# The daemon and CLI are copied in beside the app binary on purpose:
# `DaemonClient.locateDaemonExecutable` looks for `morbstackd` next to the
# running executable first, so a bundle assembled here can start the engine
# without anything being installed on PATH. That is what makes the app work
# on a machine that has only ever seen the repository.
#
# Ad-hoc signing (`--sign -`) is the last step because every earlier step
# mutates the bundle, and a signature only covers what was there when it was
# made. Unsigned, macOS 15 refuses to launch the bundle at all.
[tasks.app]
description = "Build, assemble, and sign Morbstack.app into dist/"
depends = ["app-icon"]
run = """
# L1's clean-machine contract is that the app bundle, not Docker Desktop or
# Homebrew, provides one coherent `docker` + Compose + Buildx toolchain. Fail before
# compiling if the staged files, their manifest, or their bytes are incomplete or
# mismatched. An executable bit alone is not provenance: without this gate a signed
# app could truthfully look complete while installing a stale/altered plugin.
verify_host_toolchain() {
	TOOLCHAIN_ROOT="$1"
	TOOLCHAIN_MODE="$2"
	TOOLCHAIN_MANIFEST="$TOOLCHAIN_ROOT/TOOLCHAIN.plist"
	case "$TOOLCHAIN_MODE" in source|sealed) ;; *)
		echo "error: unknown Docker CLI toolchain verification mode: $TOOLCHAIN_MODE" >&2
		exit 1
	esac
	if [ ! -d "$TOOLCHAIN_ROOT" ] || [ -L "$TOOLCHAIN_ROOT" ] \
		|| [ ! -f "$TOOLCHAIN_MANIFEST" ] || [ -L "$TOOLCHAIN_MANIFEST" ]; then
		echo "error: bundled Docker CLI toolchain root or manifest is missing/unsafe: $TOOLCHAIN_ROOT" >&2
		exit 1
	fi
	/usr/bin/plutil -lint "$TOOLCHAIN_MANIFEST" >/dev/null \
		|| { echo "error: invalid Docker CLI toolchain manifest: $TOOLCHAIN_MANIFEST" >&2; exit 1; }
	if [ "$(/usr/bin/plutil -extract schema_version raw "$TOOLCHAIN_MANIFEST")" != "1" ] \
		|| [ "$(/usr/bin/plutil -extract platform raw "$TOOLCHAIN_MANIFEST")" != "darwin-arm64" ]; then
		echo "error: unsupported Docker CLI toolchain manifest: $TOOLCHAIN_MANIFEST" >&2
		exit 1
	fi
	while IFS='|' read -r INDEX ID PATH VERSION SHA256; do
		if [ "$(/usr/bin/plutil -extract "tools.$INDEX.id" raw "$TOOLCHAIN_MANIFEST")" != "$ID" ] \
			|| [ "$(/usr/bin/plutil -extract "tools.$INDEX.path" raw "$TOOLCHAIN_MANIFEST")" != "$PATH" ] \
			|| [ "$(/usr/bin/plutil -extract "tools.$INDEX.version" raw "$TOOLCHAIN_MANIFEST")" != "$VERSION" ] \
			|| [ "$(/usr/bin/plutil -extract "tools.$INDEX.source_sha256" raw "$TOOLCHAIN_MANIFEST")" != "$SHA256" ]; then
			echo "error: Docker CLI toolchain manifest does not match pinned $ID metadata" >&2
			exit 1
		fi
		MANIFEST_SHA256="$(/usr/bin/plutil -extract "tools.$INDEX.sha256" raw "$TOOLCHAIN_MANIFEST")"
		if [ "$TOOLCHAIN_MODE" = source ] && [ "$MANIFEST_SHA256" != "$SHA256" ]; then
			echo "error: source Docker CLI toolchain manifest does not pin $ID bytes" >&2
			exit 1
		fi
		TOOL="$TOOLCHAIN_ROOT/$PATH"
		if [ ! -f "$TOOL" ] || [ -L "$TOOL" ] || [ ! -x "$TOOL" ]; then
			echo "error: required bundled Docker CLI asset is missing/unsafe: $TOOL" >&2
			echo "       run scripts/fetch-guest-assets.sh --host-cli first" >&2
			exit 1
		fi
		GOT_SHA256=$(shasum -a 256 "$TOOL" | awk '{print $1}')
		if [ "$GOT_SHA256" != "$MANIFEST_SHA256" ]; then
			echo "error: bundled Docker CLI asset failed SHA-256 verification: $TOOL" >&2
			exit 1
		fi
	done <<'EOF'
0|docker|docker|29.7.1|49d98ab806e8678cd6341b09dad6389e5bcd8a46513de7651053bee3d8366e8d
1|compose|cli-plugins/docker-compose|v5.3.1|32691ba1196d819fa68cbdc0aad9a5569e730a35ae40c6fdd8458110ecd69488
2|buildx|cli-plugins/docker-buildx|v0.36.0|82c6a3d9df37790c5bdb0d7ca88986d1d17622fc2b88ebe34b275c6c47acd7a6
EOF
	if /usr/bin/plutil -extract tools.3.id raw "$TOOLCHAIN_MANIFEST" >/dev/null 2>&1; then
		echo "error: Docker CLI toolchain manifest contains unexpected tool entries" >&2
		exit 1
	fi
}
seal_host_toolchain() {
	TOOLCHAIN_ROOT="$1"
	TOOLCHAIN_MANIFEST="$TOOLCHAIN_ROOT/TOOLCHAIN.plist"
	while IFS='|' read -r INDEX PATH; do
		TOOL="$TOOLCHAIN_ROOT/$PATH"
		GOT_SHA256=$(shasum -a 256 "$TOOL" | awk '{print $1}')
		/usr/bin/plutil -replace "tools.$INDEX.sha256" -string "$GOT_SHA256" "$TOOLCHAIN_MANIFEST" \
			|| { echo "error: could not seal Docker CLI toolchain manifest" >&2; exit 1; }
	done <<'EOF'
0|docker
1|cli-plugins/docker-compose
2|cli-plugins/docker-buildx
EOF
}
verify_host_toolchain dist/host-bin source
# `kubectl` is intentionally optional today: there is no port-forward feature to
# ship until its bounded coordinator and clean-cluster acceptance exist. If a
# release pipeline has explicitly staged the future helper, however, verify the
# exact provenance pin here before copying/signing it. A missing helper remains a
# truthful unavailable state in MorbstackKit; a mismatched or symlinked helper must
# never become a sealed part of an app bundle.
KUBECTL=dist/host-bin/kubernetes/kubectl
if [ -e "$KUBECTL" ] || [ -L "$KUBECTL" ]; then
	if [ ! -x "$KUBECTL" ] || [ -L "$KUBECTL" ]; then
		echo "error: optional bundled kubectl is not an executable regular file: $KUBECTL" >&2
		exit 1
	fi
	KUBECTL_SHA256=`shasum -a 256 "$KUBECTL" | awk '{print $1}'`
	if [ "$KUBECTL_SHA256" != "4408c85c83fd3a31adaa555bdf3c7a6c81f74b19449a9060ba31ab91926f023d" ]; then
		echo "error: optional bundled kubectl failed SHA-256 verification: $KUBECTL" >&2
		exit 1
	fi
fi

# One product per invocation: `swift build` accepts a single `--product`,
# and passing two silently builds only the last one — which then fails
# three lines down on a missing binary rather than at the flag that was
# wrong.
#
# This list of three (MorbstackApp, morbstackd, morb) is a curated bundle
# manifest, not an enumeration of Package.swift's product/target graph —
# do NOT "helpfully" derive it from the package (e.g. by looping over every
# `.executable` product, or every target morb depends on). Which binaries
# belong inside a GUI app bundle is a product decision, not something
# inferable from the dependency graph: morb pulls in MorbFeatures, MorbMCP,
# MorbMigrate, MorbBench, MorbScan etc. as internal library targets (not
# separate top-level executables), and none of that plumbing belongs in
# Contents/MacOS. If a future product decision adds a fourth binary to the
# bundle, add it here explicitly, the same way you would have added a
# fourth `swift build --product` line to the old Makefile recipe.
(cd mac && swift build -c release --product MorbstackApp)
(cd mac && swift build -c release --product morbstackd)
(cd mac && swift build -c release --product morb)
# The runtime version is an immutable payload namespace inside the signed app bundle.
# Keep it aligned with the host binaries until runtime releases gain their own cadence.
VERSION=`sed -n 's/.*public static let string = "\\(.*\\)".*/\\1/p' mac/Sources/MorbstackKit/Version.swift`
[ -n "$VERSION" ] || { echo "error: could not determine Morbstack runtime version" >&2; exit 1; }
rm -rf dist/Morbstack.app
mkdir -p dist/Morbstack.app/Contents/MacOS
mkdir -p dist/Morbstack.app/Contents/Resources
mkdir -p dist/Morbstack.app/Contents/Library/LaunchAgents
cp mac/.build/release/MorbstackApp dist/Morbstack.app/Contents/MacOS/MorbstackApp
cp mac/.build/release/morbstackd dist/Morbstack.app/Contents/MacOS/morbstackd
cp mac/.build/release/morb dist/Morbstack.app/Contents/MacOS/morb
cp mac/.build/AppIcon.icns dist/Morbstack.app/Contents/Resources/AppIcon.icns
# Keep the source tree's host toolchain layout intact inside the bundle.  The
# first-run installer resolves these exact paths and symlinks them only after the
# person at the keyboard has consented; the toolchain is never fetched from the
# network, copied out of Docker Desktop, or looked up on PATH at install time.
cp -R dist/host-bin dist/Morbstack.app/Contents/Resources/host-bin
# Copying is itself a supply-chain boundary. Verify the copied layout before signing
# so the sealed app cannot carry a partial or mismatched toolchain.
verify_host_toolchain dist/Morbstack.app/Contents/Resources/host-bin source
cp mac/AppResources/LaunchAgents/dev.morbstack.daemon.plist \
	dist/Morbstack.app/Contents/Library/LaunchAgents/dev.morbstack.daemon.plist
cp mac/AppResources/Info.plist dist/Morbstack.app/Contents/Info.plist
printf 'APPL????' > dist/Morbstack.app/Contents/PkgInfo
# A release carries every byte needed to boot Docker and enable Kubernetes. The
# packager hashes and copies existing assets only; it neither downloads nor builds
# them, so release automation remains the one place that decides their provenance.
RUNTIME_SOURCE_ROOT="${MORBSTACK_RUNTIME_SOURCE_ROOT:-${MORBSTACK_HOME:-$HOME/.morbstack}/data}"
scripts/package-runtime-artifacts.sh \
	--source-root "$RUNTIME_SOURCE_ROOT" \
	--destination dist/Morbstack.app/Contents/Resources/runtime \
	--version "$VERSION"
# Stamp the real version in, so the bundle and `morb version` agree.
if [ -n "$VERSION" ]; then
	/usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" dist/Morbstack.app/Contents/Info.plist
	/usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" dist/Morbstack.app/Contents/Info.plist
fi
# Sign inside-out: nested helpers first, then the bundle that contains them.
#
# morbstackd needs the virtualization entitlement to open a VM at all, and
# it is signed separately because the app itself must not carry that
# entitlement. The order matters and so does the absence of --deep: --deep
# re-signs nested code with the *outer* invocation's arguments, so signing
# the app with --deep after signing morbstackd silently re-signs morbstackd
# with no entitlements at all. The symptom is not a build failure — it is a
# shipped app whose bundled daemon cannot create a VZVirtualMachine, which
# is the one thing it is in there to do. Signing the outer bundle on its own
# seals the helpers by reference through CodeResources and leaves their own
# signatures, and their entitlements, intact.
codesign --force --sign - dist/Morbstack.app/Contents/MacOS/morb
codesign --force --sign - --entitlements mac/Resources/morbstackd.entitlements \
	dist/Morbstack.app/Contents/MacOS/morbstackd
# The upstream host binaries execute from inside the app bundle.  Sign them before
# sealing the outer app so a quarantined DMG does not leave a clean-machine user with
# helpers Gatekeeper refuses to launch.  They remain upstream binaries; this adds only
# the bundle's code-signature envelope.
codesign --force --sign - dist/Morbstack.app/Contents/Resources/host-bin/docker
codesign --force --sign - dist/Morbstack.app/Contents/Resources/host-bin/cli-plugins/docker-compose
codesign --force --sign - dist/Morbstack.app/Contents/Resources/host-bin/cli-plugins/docker-buildx
if [ -e dist/Morbstack.app/Contents/Resources/host-bin/kubernetes/kubectl ]; then
	codesign --force --sign - dist/Morbstack.app/Contents/Resources/host-bin/kubernetes/kubectl
fi
# Nested-code signatures deliberately change Mach-O bytes. Record those final hashes
# only after the unsigned source layout passed its upstream-pin check; the outer app
# signature immediately below then seals the manifest and the exact signed helpers.
seal_host_toolchain dist/Morbstack.app/Contents/Resources/host-bin
verify_host_toolchain dist/Morbstack.app/Contents/Resources/host-bin sealed
codesign --force --sign - dist/Morbstack.app
# Fail loudly rather than shipping a daemon that cannot boot the guest.
codesign -d --entitlements - dist/Morbstack.app/Contents/MacOS/morbstackd 2>&1 \
	| grep -q "com.apple.security.virtualization" \
	|| { echo "error: morbstackd lost its virtualization entitlement during signing" >&2; exit 1; }
echo "built dist/Morbstack.app"
"""

[tasks.run-app]
description = "Build and launch Morbstack.app"
depends = ["app"]
run = "open dist/Morbstack.app"

# ---------------------------------------------------------------------------
# Clean
# ---------------------------------------------------------------------------

[tasks.clean-app]
description = "Remove the assembled app bundle and icon build products"
run = "rm -rf dist/Morbstack.app mac/.build/AppIcon.icns mac/.build/AppIcon.iconset"

[tasks.clean]
description = "Remove build outputs from both toolchains"
depends = ["clean-app"]
run = """
rm -rf mac/.build
(cd guest/morbinit && cargo clean)
"""
