# mise configuration for Morbstack.
#
# This file pins tools and settings. **The build tasks themselves live in
# `mise-tasks/`**, one executable file per task, with their metadata in
# `#MISE description=...` / `#MISE depends=[...]` header comments. Run
# `mise tasks` to list them, `mise run <task>` to run one, and
# `mise task info <task>` to see where a task's file lives.
#
# Why files instead of inline `run = """..."""` strings: the recipes here are
# real shell programs — the app-bundle assembly alone is 200 lines with two
# functions, heredocs, and a supply-chain verification pass. As TOML strings they
# were unreviewable, unlintable (shellcheck cannot see inside a TOML string), and
# every backslash needed TOML escaping on top of shell escaping. As files they
# are ordinary scripts: shellcheck runs on them, diffs are readable, and the
# escaping is only shell escaping.
#
# Two toolchains live side by side: Swift (host daemon + CLI, under mac/) and
# Rust (guest PID 1, under guest/morbinit/). `mise install` pins the Rust
# compiler for every contributor and CI; Swift is not managed here — it comes
# from the Xcode toolchain (macOS 26.4 / Swift 6.3).
#
# The Makefile at the repo root is a thin compatibility shim: every
# `make <target>` just runs `mise run <target>`. It exists only so callers that
# still type `make build` keep working; new callers (docs, CI, scripts) should
# use `mise run <task>` directly. See docs/build.md for the full task list.
#
# NOTE on first run: `mise run <anything>` requires this file to already be
# trusted, which is a chicken-and-egg problem for a task that tries to automate
# `mise trust` itself — mise refuses to even parse an untrusted config to find
# the task in the first place. So the very first command on a fresh clone must be
# the literal `mise trust && mise install` (see README.md / CONTRIBUTING.md and
# the Makefile's `setup` shim), not `mise run setup`. The `setup` task still
# exists for convenience on an already-trusted checkout (e.g. after pulling a
# mise.toml change that bumps the Rust pin).
#
# TASK AUTHORING RULES (each of these was a real bug once):
#
#  1. mise runs a multi-line task body as ONE shell, unlike make's fresh shell
#     per line, so a bare `cd` leaks into every later line. Wrap directory
#     changes in subshells: `(cd mac && swift build)`.
#  2. Signing order is load-bearing. `swift build` strips
#     com.apple.security.virtualization from morbstackd, so signing is always the
#     LAST step after the last build, and bundle signing is INSIDE-OUT with NO
#     `--deep` — `--deep` silently re-signs nested code with the outer
#     invocation's arguments and strips the entitlement, producing an app whose
#     engine can never boot a VM. `mise-tasks/app` and `mise-tasks/sign` both end
#     with a hard post-check that the entitlement survived. Do not remove it.
#  3. The list of binaries copied into the app bundle is a curated product
#     decision, not something to derive from Package.swift's target graph.

[tools]
rust = "stable"

# Task files are discovered in ./mise-tasks by default; stated explicitly so the
# location is greppable from the config rather than implied.
[task_config]
includes = ["mise-tasks"]
