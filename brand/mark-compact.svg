<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Morbstack">
  <title>Morbstack</title>
  <!--
    The compact detail level of the mark: TWO slabs, not three.

    docs/design/IDENTITY.md §1.4 switches the stack from 3 slabs to 2 below 64px,
    because three at full-detail proportions is a 2.8px slab with a 1.7px gap, which
    greys out. Both detail levels occupy the same band (v approximately 0.10 to 0.55)
    so the silhouette does not jump when the level changes.

    This file is the source for the favicon and for anything else that will be seen
    at 32px or smaller. It is deliberately a separate file rather than a media query:
    a favicon is picked by the browser at a size we do not control, so the small
    artwork has to be its own asset.

      slab height   0.150 * 843.776 = 126.566, corner 25.313
      slab centres  v = 0.185, 0.470
      pitch         0.285

    No sheen, no rim, no shadow: below 64px IDENTITY.md §1.3 drops all three, and at
    32px they are noise that costs contrast.
  -->
  <defs>
    <linearGradient id="plate" x1="90.112" y1="90.112" x2="933.888" y2="933.888" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A1F9E"/>
      <stop offset="1" stop-color="#7A3BE8"/>
    </linearGradient>
    <mask id="gap">
      <rect x="0" y="0" width="1024" height="1024" fill="#000"/>
      <rect x="90.112" y="90.112" width="843.776" height="843.776" rx="198.287" ry="198.287" fill="#fff"/>
      <circle cx="512" cy="385.434" r="221.913" fill="#000"/>
    </mask>
  </defs>

  <rect x="90.112" y="90.112" width="843.776" height="843.776" rx="198.287" ry="198.287" fill="url(#plate)"/>

  <g mask="url(#gap)" fill="#FFFFFF">
    <!-- v = 0.185 -> centre y 777.789, minus half of 126.566 -->
    <rect x="149.176" y="714.506" width="725.647" height="126.566" rx="25.313" ry="25.313"/>
    <!-- v = 0.470 -> centre y 537.313 -->
    <rect x="149.176" y="474.030" width="725.647" height="126.566" rx="25.313" ry="25.313"/>
  </g>

  <circle cx="512" cy="385.434" r="198.287" fill="#FFFFFF"/>
</svg>
