<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 115 860 775" width="18" height="16.22">
  <!--
    The menu-bar template symbol: the mark with the plate removed.

    A macOS template image is pure black plus an alpha channel; AppKit recolours it
    for the menu bar's appearance, for the "highlighted" state when the extra is
    open, and for Reduce Transparency. So there is no gradient here, no colour, and
    no plate — the plate IS the thing the menu bar cannot render, because at 16pt a
    filled violet square in the menu bar looks like a badge, not like a symbol.

    Compact detail level (two slabs, docs/design/IDENTITY.md §1.4), because the menu
    bar is 16-18pt and three slabs grey out there. The viewBox is a tight crop of the
    glyph's bounding box in plate units scaled by 1000:

      orb centre  (500, 350), radius 235, halo 263
      slabs       x 70, width 860, height 150, corner 30
      slab tops   740 (v = 0.185) and 455 (v = 0.470)
      bbox        x 70..930, y 115 (orb top) .. 890 (lowest slab bottom)

    The gap between the orb and the top slab is transparent here rather than
    plate-coloured. That is the correct reading for a template: the menu bar's own
    background shows through, which is what makes the orb and the stack read as two
    objects rather than one silhouette.
  -->
  <defs>
    <mask id="gap">
      <rect x="70" y="115" width="860" height="775" fill="#fff"/>
      <circle cx="500" cy="350" r="263" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#gap)" fill="#000000">
    <rect x="70" y="740" width="860" height="150" rx="30" ry="30"/>
    <rect x="70" y="455" width="860" height="150" rx="30" ry="30"/>
  </g>

  <circle cx="500" cy="350" r="235" fill="#000000"/>
</svg>
