<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Icon Composer BACKGROUND layer. Import into Icon Composer as the bottom layer.

    Deliberately plain: a full-bleed 1024x1024 linear gradient and nothing else.

    Per Apple's app-icon guidance (docs/design/tahoe/HIG-FINDINGS.md, "App icon"),
    layered icons must be UNMASKED and must NOT bake in specular highlights, drop
    shadows, bevels, blurs or glows — the system generates all of those, and a baked
    one double-renders. That is why the sheen, the inner rim and the drop shadow that
    docs/design/IDENTITY.md §1.3 specifies for the standalone mark are all absent here,
    and why the plate is a bare rectangle rather than a squircle: Icon Composer applies
    the mask.

    The gradient endpoints are Theme.brandDeep (#2A1F9E) and the violet one stop past
    Theme.brandSecondary (#7A3BE8), the same pair as the app's brandGradient. White on
    #2A1F9E is 11.74:1 and white on #7A3BE8 is 5.80:1, so the white glyph in
    foreground.svg is legible against every point of it.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A1F9E"/>
      <stop offset="1" stop-color="#7A3BE8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#plate)"/>
</svg>
